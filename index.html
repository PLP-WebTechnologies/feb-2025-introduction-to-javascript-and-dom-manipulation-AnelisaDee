<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>DOM Manipulation</title>
  </head>
  <body>
    <header>
      <h1 id="main-title">Welcome to My Page</h1>
    </header>

    <main>
      <section>
        <p id="intro-text">This is some introductory text that will change.</p>
        <button id="change-text-btn">Change Text</button>
      </section>

      <article>
        <p id="style-paragraph">This paragraph's style will be updated.</p>
        <button id="change-style-btn">Change Style</button>
      </article>

      <section>
        <button id="toggle-element-btn">Add/Remove Element</button>
        <div id="element-container"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 Copyrights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
